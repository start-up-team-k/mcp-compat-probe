name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Offline tests (no secrets, no network)
        run: python -m unittest discover -s tests -v
      - name: Install and smoke test the CLI
        run: |
          pip install .
          set +e
          mcp-compat-probe check examples/tools-list.json
          test $? -eq 1
