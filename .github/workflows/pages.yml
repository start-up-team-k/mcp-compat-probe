name: pages
on:
  push:
    branches: [main]
    paths: ["site/**", "mcp_compat_probe/data/**"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp site/index.html _site/
          cp -r mcp_compat_probe/data/. _site/data/
          mkdir -p _site/data/results
          python3 -c "import json,os; print(json.dumps(sorted(os.listdir('_site/data/results'),reverse=True)))" > _site/data/index.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
