[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-compat-probe"
version = "0.1.0"
description = "Measured JSON Schema compatibility of MCP tools with Anthropic and OpenAI APIs"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.scripts]
mcp-compat-probe = "mcp_compat_probe.cli:main"

[tool.setuptools]
packages = ["mcp_compat_probe"]

[tool.setuptools.package-data]
mcp_compat_probe = ["data/*.json", "data/results/*.json"]
